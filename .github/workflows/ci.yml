name: VeriFact CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python scripts/validate_delivery.py
      - run: docker build -t verifact-api-ci ./backend
      - run: docker build -t verifact-frontend-ci ./frontend
      - name: Production migration smoke test
        run: |
          cp .env.production.example .env.production
          cat >> .env.production <<'EOF'
          VERIFACT_DOMAIN=ci.verifact.example
          VERIFACT_TLS_EMAIL=ci@example.com
          VERIFACT_FRONTEND_ORIGIN=https://ci.verifact.example
          VERIFACT_PUBLIC_BASE_URL=https://ci.verifact.example
          VERIFACT_ALLOWED_HOSTS=ci.verifact.example
          VERIFACT_SECRET_KEY=ci-only-secret-key-with-at-least-thirty-two-characters
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          EOF
          docker compose -f docker-compose.prod.yml --env-file .env.production config >/dev/null
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d verifact-db verifact-redis
          docker compose -f docker-compose.prod.yml --env-file .env.production --profile ops run --rm verifact-migrate
          docker compose -f docker-compose.prod.yml --env-file .env.production down -v
